name: build-and-push

# Builds the Docker image on every push and publishes it to GHCR.
#
# GHCR push requires a token with `write:packages`. The default GITHUB_TOKEN
# carries it, so this works with no extra secrets once the repository's Actions
# permissions allow it (Settings -> Actions -> General -> Workflow permissions:
# "Read and write").
#
# The image is public, so the package must also be set to public visibility in the
# package settings before anyone can pull it without a token.

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      # tests/pbr.mjs drives a real browser, so install the headless shell.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Headless sim suites that need no server at all.
      - run: node tests/hitreg.mjs
      - run: node tests/fullmatch.mjs
      # Everything below talks to a live server on port 8080. None of these tests
      # boot one themselves - that is why they all timed out / ECONNREFUSED in CI
      # until the server step was added below.
      - name: Start server
        run: |
          node server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null; then echo "up after ${i}s"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ >/dev/null || { cat server.log; exit 1; }
      - run: node tests/combat.mjs
      - run: node tests/two-clients.mjs
      - run: node tests/browser.mjs
        env:
          # browser.mjs reads BASE (not URL) - checked, not assumed.
          BASE: http://127.0.0.1:8080
      - run: node tests/pbr.mjs
        env:
          URL: http://127.0.0.1:8080/
      - name: Server log
        if: always()
        run: tail -20 server.log

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          # Publish linux/amd64 and linux/arm64. A single-arch image is not
          # pullable on the other architecture - an arm64 machine (Apple Silicon,
          # Graviton) fails with "no matching manifest", which is exactly how this
          # was first shipped and caught.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max