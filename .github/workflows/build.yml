name: build-and-push

# Builds the Docker image on every push and publishes it to GHCR.
#
# GHCR push requires a token with `write:packages`. The default GITHUB_TOKEN
# carries it, so this works with no extra secrets once the repository's Actions
# permissions allow it (Settings -> Actions -> General -> Workflow permissions:
# "Read and write").
#
# The image is public, so the package must also be set to public visibility in the
# package settings before anyone can pull it without a token.

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Headless sim suites: hit registration, a full bot match, two networked
      # clients. These need no browser and no GPU.
      - run: node tests/hitreg.mjs
      - run: node tests/fullmatch.mjs
      - run: node tests/two-clients.mjs
      - run: node tests/combat.mjs
      - run: node tests/pbr.mjs

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max